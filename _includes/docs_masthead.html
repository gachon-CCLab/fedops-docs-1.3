{% assign masthead_home = '/' %}
{% if page.docs_version != '1.3' %}{% assign masthead_home = '/v1.2/' %}{% endif %}
<header class="docs-masthead">
  <div class="docs-masthead-inner">
    <a class="docs-brand" href="{{ masthead_home | relative_url }}"><span class="docs-brandmark" aria-hidden="true" style="background-image:url('{{ '/assets/images/fedops-icon.png' | relative_url }}')"></span>FedOps</a>
    <span class="docs-badge">{{ page.docs_version | default: '1.2' }} Docs</span>
    <nav aria-label="FedOps" class="docs-global-nav">
      <a href="{{ masthead_home | relative_url }}" aria-current="page">Document</a>
      <a href="https://github.com/gachon-CCLab/FedOps">GitHub <span aria-hidden="true">↗</span></a>
      <a class="docs-console" href="https://ccl.gachon.ac.kr/fedops">FedOps Console <span aria-hidden="true">↗</span></a>
    </nav>
  </div>
</header>
