<header class="docs-masthead">
  <div class="docs-masthead-inner">
    <a class="docs-brand" href="{{ site.home_url }}" aria-label="FedOps home">
      <img src="{{ '/assets/images/fedops-navbar-icon.png' | relative_url }}" alt="" width="36" height="36">
      <span>FedOps</span>
    </a>
    <span class="docs-badge">{{ page.docs_version | default: '1.3' }}{% if page.docs_version == '1.3' %} beta{% endif %}</span>
    <nav id="docs-global-menu" class="docs-global-nav" aria-label="Primary navigation">
      <a href="{{ '/' | relative_url }}" aria-current="page">Docs</a>
      <a href="{{ '/blog/' | relative_url }}">Blog</a>
      <a href="{{ '/news/' | relative_url }}">News</a>
    </nav>
    <a class="docs-console" href="{{ site.console_url }}" target="_blank" rel="noopener noreferrer">Open Console <span aria-hidden="true">↗</span><span class="docs-sr-only"> (opens in a new tab)</span></a>
  </div>
</header>
